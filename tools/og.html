<!doctype html>
<!-- Socialinių tinklų paveikslėlio (1200×630) šablonas; PNG generuojamas: node tools/images.mjs -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 100 900; src: url('../src/static/assets/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: Inter; font-weight: 100 900; src: url('../src/static/assets/fonts/inter-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-02BA; }
  @font-face { font-family: Mono; font-weight: 100 800; src: url('../src/static/assets/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif;
    color: #e9edf6;
    background:
      radial-gradient(55% 70% at 85% 20%, rgba(94, 128, 255, 0.28), transparent 70%),
      linear-gradient(rgba(233,237,246,.05) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(233,237,246,.05) 1px, transparent 1px) 0 0 / 48px 48px,
      #090e1a;
    display: grid;
    grid-template-columns: 1fr 340px;
    align-items: center;
    gap: 56px;
    padding: 72px 80px;
  }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border: 1px solid #2a3657; border-radius: 99px; font-size: 20px; color: #c5cddd; background: #10172a; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 6px rgba(74,222,128,.18); }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: 28px 0 22px; }
  .role { font-size: 32px; font-weight: 600; color: #c5cddd; line-height: 1.3; }
  .role b { color: #7b96ff; font-weight: 600; }
  .url { margin-top: 36px; font-family: Mono, monospace; font-size: 22px; color: #94a0b8; }
  .url span { color: #7dd3a8; }
  .photo { width: 340px; height: 340px; border-radius: 50%; overflow: hidden; outline: 2px solid #2a3657; outline-offset: 10px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.27); }
</style>
</head>
<body>
  <div>
    <p class="pill"><span class="dot"></span>Disponible immédiatement · Île-de-France</p>
    <h1>Saulius<br>Stankevicius</h1>
    <p class="role">Technicien Support &amp; Systèmes Réseaux<br><b>orienté cybersécurité</b></p>
    <p class="url"><span>$</span> saulius.elitecordiste.fr</p>
  </div>
  <div class="photo"><img src="../src/static/assets/img/profile.jpg" alt=""></div>
</body>
</html>
